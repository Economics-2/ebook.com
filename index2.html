<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f0c29">
    <title>Future eBook - Monjurul Haque</title>
    <link rel="manifest" href="manifest.json">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #00f3ff;
            --secondary: #bc13fe;
            --bg: #0f0c29;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 100%);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background: var(--glass);
            backdrop-filter: blur(10px);
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky;
            top: 0;
            z-index: 50;
        }
        h1 { margin: 0; color: var(--primary); font-family: 'Orbitron', sans-serif; font-size: 1.4rem; }

        /* Main Content Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        /* Cover Page Styles */
        #cover-view {
            animation: fadeIn 1s ease-in;
            width: 100%;
            max-width: 400px;
        }

        .book-cover {
            width: 200px;
            height: 300px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.3), 
                        5px 5px 15px rgba(0,0,0,0.5); /* 3D effect */
            border: 2px solid var(--secondary);
            margin-bottom: 20px;
            transition: transform 0.3s;
        }

        .book-cover:hover { transform: scale(1.05); }

        .read-btn {
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            border: none;
            padding: 12px 40px;
            color: #000;
            font-weight: bold;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(188, 19, 254, 0.4);
            font-family: 'Orbitron', sans-serif;
            margin-top: 15px;
        }

        /* PDF View Styles (Hidden Initially) */
        #pdf-view {
            display: none;
            width: 100%;
            height: 80vh;
            background: #fff; /* PDF container background */
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid var(--primary);
        }

        iframe { width: 100%; height: 100%; border: none; }

        .back-btn {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 5px 15px;
            margin-bottom: 10px;
            cursor: pointer;
            display: none; /* Visible only in PDF mode */
        }

        /* Ad Section */
        .ad-banner {
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed var(--primary);
            padding: 15px;
            border-radius: 10px;
            width: 100%;
            max-width: 500px;
        }
        .ad-banner a { color: var(--primary); text-decoration: none; font-weight: bold; }

        /* Install Prompt */
        #install-prompt {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #1a1a1a; padding: 15px; border-radius: 10px; border: 1px solid var(--primary);
            display: none; text-align: center; width: 90%; max-width: 350px; z-index: 100;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header>
        <button class="back-btn" id="back-btn" onclick="showCover()"><i class="fas fa-arrow-left"></i> Back</button>
        <h1>NeuroRead</h1>
    </header>

    <div class="main-content">
        
        <div id="cover-view">
            <img src="cover.jpg" alt="Book Cover" class="book-cover">
            
            <h2 style="margin-bottom: 5px;">ইকোনমিক্স মাস্টার গাইড</h2>
            <p style="color: #ccc; margin-bottom: 20px;">লেখক: মোঃ মঞ্জুরুল হক</p>
            
            <button class="read-btn" onclick="openBook()">
                <i class="fas fa-book-open"></i> পড়া শুরু করুন
            </button>

            <div class="ad-banner">
                <p>💡 ক্যারিয়ার গড়তে ও ইকোনমিক্স শিখতে</p>
                <a href="https://economics-2.github.io/Master-Strategic-Guide/about.html" target="_blank">
                    ভিজিট করুন: মাস্টার স্ট্র্যাটেজিক গাইড <i class="fas fa-external-link-alt"></i>
                </a>
            </div>
        </div>

        <div id="pdf-view">
            <iframe src="YOUR_PDF_FILE.pdf#toolbar=0" title="PDF Reader">
                <p>PDF লোড হচ্ছে না। <a href="YOUR_PDF_FILE.pdf">ডাউনলোড করুন</a></p>
            </iframe>
        </div>

    </div>

    <div id="install-prompt">
        <p>⚠️ অ্যাপটি ইন্সটল করুন!</p>
        <button onclick="installApp()" style="background:var(--primary); border:none; padding:5px 15px; font-weight:bold; margin-top:5px;">INSTALL</button>
    </div>

    <script>
        // ফাংশন: বই ওপেন করা
        function openBook() {
            document.getElementById('cover-view').style.display = 'none';
            document.getElementById('pdf-view').style.display = 'block';
            document.getElementById('back-btn').style.display = 'inline-block';
        }

        // ফাংশন: কভারে ফিরে আসা
        function showCover() {
            document.getElementById('cover-view').style.display = 'block';
            document.getElementById('pdf-view').style.display = 'none';
            document.getElementById('back-btn').style.display = 'none';
        }

        // PWA Install Logic
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (!window.matchMedia('(display-mode: standalone)').matches) {
                setTimeout(() => document.getElementById('install-prompt').style.display = 'block', 3000);
            }
        });

        function installApp() {
            document.getElementById('install-prompt').style.display = 'none';
            if (deferredPrompt) deferredPrompt.prompt();
        }

        // Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
